<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Number</title>
</head>
<body align="center">
    <h1>Mobile Number Pattern</h1>
    <form action="./succes.html">

        <label for="no">Enter Mobile Number:*</label>
        <input type="tel" name="number" id="no" pattern="\+91 [0-9]{10}" title="Enter Mobile No. in '+91 xxxxxxxxxx' (10 Digit) Format" autofocus autocomplete="off" placeholder="+91 xxxxxxxxxx" required>
        <br><br>
        <button>Submit</button>

    </form>
</body>
</html>
